name: build site

on:
  schedule:
    # After the profile job in bmmmm/bmmmm (03:20 UTC), so this run picks up
    # the feed that job just wrote rather than yesterday's.
    - cron: "45 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build-site.sh"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: render project list, llms.txt and JSON-LD
        run: .github/scripts/build-site.sh

      - name: commit only on a real change
        run: |
          set -euo pipefail
          git add -A index.html llms.txt
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(site): refresh project list, llms.txt and JSON-LD"
          git push
